<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Health Care Sierra Leone USA badge</title>
  <desc id="desc">A circular healthcare logo with the text Health Care Sierra Leone USA and a stethoscope symbol.</desc>
  <defs>
    <linearGradient id="outerGreen" x1="0" x2="1">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E9B57"/>
    </linearGradient>
    <linearGradient id="innerBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#0d6aa6"/>
      <stop offset="100%" stop-color="#0a4e7d"/>
    </linearGradient>
  </defs>

  <circle cx="450" cy="450" r="420" fill="url(#outerGreen)"/>
  <circle cx="450" cy="450" r="355" fill="url(#innerBlue)" stroke="#ffffff" stroke-width="16"/>
  <circle cx="450" cy="450" r="260" fill="#ffffff"/>

  <path id="topArc" d="M 165 450 A 285 285 0 0 1 735 450" fill="none"/>
  <path id="bottomArc" d="M 165 450 A 285 285 0 0 0 735 450" fill="none"/>

  <text fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" letter-spacing="2">
    <textPath href="#topArc" startOffset="14%" text-anchor="middle">HealthCare Sierra Leone</textPath>
  </text>

  <text fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="16%" text-anchor="middle">Excellence</textPath>
  </text>

  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="165" y="310" font-size="52" transform="rotate(-90 165 310)">RESPECT</text>
    <text x="740" y="600" font-size="52" transform="rotate(90 740 600)">INTEGRITY</text>
    <text x="455" y="740" font-size="52">COMPASSION</text>
  </g>

  <g transform="translate(450 450)">
    <g stroke="#1d1d1d" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -110 0 C -80 -50, -60 -70, -50 -52 C -30 -20, -38 20, 0 20 C 38 20, 32 -35, 55 -52 C 80 -72, 108 -56, 112 0" stroke-width="12"/>
      <path d="M -35 0 L -35 35 C -35 55, -20 70, 0 70 C 20 70, 35 55, 35 35 L 35 0" stroke-width="9"/>
      <path d="M 0 70 L 0 145" stroke-width="9"/>
      <path d="M -25 23 C -15 48, -8 60, 0 60 C 9 60, 15 48, 25 23" stroke-width="6"/>
      <path d="M -140 10 C -130 -10, -115 -22, -96 -22 C -84 -22, -75 -10, -72 0 C -69 12, -75 24, -90 28 C -103 31, -118 25, -130 14" stroke-width="8"/>
    </g>

    <g fill="#ffffff" stroke="#000000" stroke-width="8" font-family="Arial, Helvetica, sans-serif" font-weight="900">
      <text x="0" y="90" text-anchor="middle" font-size="170" fill="#d82d3b">USA</text>
    </g>

    <path d="M -50 165 L -10 122 L 18 150 L 72 92" stroke="#d82d3b" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
